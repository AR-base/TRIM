name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trim
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: trim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trim" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools && pip install -e ".[dev]"
      - name: Lint
        run: ruff check trim tests && ruff format --check trim tests
      - name: Tests (coverage must stay above 80%)
        run: pytest --cov=trim --cov-report=term --cov-fail-under=80
      - name: Tests on PostgreSQL (the production database)
        run: pytest -o addopts="" -q
        env:
          TRIM_TEST_DATABASE_URL: postgresql+psycopg://trim:ci-only-password@localhost:5432/trim
      - name: Static security analysis
        run: bandit -q -c pyproject.toml -r trim
      - name: Dependency vulnerabilities
        run: pip-audit --skip-editable
      - name: Migrations apply cleanly
        run: TRIM_DATABASE_URL=sqlite:///./ci.db trim init-db
      - name: Model quality on simulated organisations
        run: trim evaluate --seeds 1 2 3 > evaluation.json && cat evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: backend/evaluation.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trim-api backend && docker build -t trim-web frontend
      - name: Production compose file is valid
        run: |
          printf 'POSTGRES_PASSWORD=x\nTRIM_DOMAIN=ci.example.org\n' > .env
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config -q
